<p-dialog
  [(visible)]="visible"
  [header]="'create_room_dialog_title' | i18next"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="room-dialog"
  (onHide)="close()">

  <form [formGroup]="form" class="room-form">

    <div class="group">
      <label class="label">{{ 'room_type' | i18next }}</label>
      <p-selectbutton
        formControlName="type"
        [options]="typeOptions"
        optionLabel="label"
        optionValue="value"
        styleClass="input" />
    </div>

    <div class="group">
      <label class="label">{{ 'room_name' | i18next }}</label>
      <input
        pInputText
        i18nextValidationMessage
        formControlName="name"
        [placeholder]="'room_name_placeholder' | i18next"
        class="input"
        autocomplete="off" />
    </div>

    @if (selectedType === 'password') {
      <div class="group">
        <label class="label">{{ 'password' | i18next }}</label>
        <p-password
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          class="input"
          inputStyleClass="input"
          [placeholder]="'room_password_placeholder' | i18next" />
      </div>
    }

  </form>

  <ng-template pTemplate="footer">
    <div class="room-footer">
      <p-button
        [label]="'cancel' | i18next"
        severity="secondary"
        (onClick)="close()" />
      <p-button
        [label]="'create' | i18next"
        [disabled]="!canSubmit"
        (onClick)="submit()" />
    </div>
  </ng-template>

</p-dialog>
