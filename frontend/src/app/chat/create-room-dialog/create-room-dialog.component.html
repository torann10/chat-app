<p-dialog
  [(visible)]="visible"
  [header]="'create_room_dialog_title' | i18next"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="w-[480px]"
  (onHide)="close()">

  <form [formGroup]="form" class="flex flex-col gap-5 py-1">

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium">{{ 'room_type' | i18next }}</label>
      <p-selectbutton
        formControlName="type"
        [options]="typeOptions"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full" />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-medium">{{ 'room_name' | i18next }}</label>
      <input
        pInputText
        i18nextValidationMessage
        formControlName="name"
        [placeholder]="'room_name_placeholder' | i18next"
        class="w-full"
        autocomplete="off" />
    </div>

    @if (selectedType === 'password') {
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium">{{ 'password' | i18next }}</label>
        <p-password
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          class="w-full"
          inputStyleClass="w-full"
          [placeholder]="'room_password_placeholder' | i18next" />
      </div>
    }

  </form>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        [label]="'cancel' | i18next"
        severity="secondary"
        (onClick)="close()" />
      <p-button
        [label]="'create' | i18next"
        [disabled]="!canSubmit"
        (onClick)="submit()" />
    </div>
  </ng-template>

</p-dialog>
