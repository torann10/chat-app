<p-dialog
  [(visible)]="visible"
  [header]="'#' + (room()?.name ?? '')"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="w-[420px]"
  (onHide)="close()">

  <div class="flex flex-col gap-4 py-1">

    <p class="text-sm text-muted">
      @if (isPasswordRoom) {
        {{ 'room_password_protected' | i18next }}
      } @else {
        {{ 'room_public' | i18next }}
      }
      @if (memberCount > 0) {
        &nbsp;{{ memberCount }} {{ memberCount === 1 ? ('member' | i18next) : ('members_word' | i18next) }}.
      }
    </p>

    @if (isPasswordRoom) {
      <form [formGroup]="form" class="flex flex-col gap-2">
        <label class="text-sm font-medium">{{ 'password' | i18next }}</label>
        <p-password
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          class="w-full"
          inputStyleClass="w-full"
          [placeholder]="'enter_room_password' | i18next"
          (keydown.enter)="submit()" />
      </form>
    }

    @if (error()) {
      <p class="text-sm text-red-500">{{ error() }}</p>
    }

  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        [label]="'cancel' | i18next"
        severity="secondary"
        [disabled]="isLoading()"
        (onClick)="close()" />
      <p-button
        [label]="'join' | i18next"
        [loading]="isLoading()"
        [disabled]="!canSubmit"
        (onClick)="submit()" />
    </div>
  </ng-template>

</p-dialog>
