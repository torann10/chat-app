<div class="chat-layout">

  @if (sidebarOpen()) {
    <div
      class="backdrop"
      (click)="closeSidebar()"
    ></div>
  }

  <aside
    class="sidebar"
    [class.sidebar-closed]="!sidebarOpen()"
  >
    <app-chat-sidebar
      [rooms]="channels()"
      [directMessages]="directMessages()"
      [activeRoomId]="activeRoom()?.id ?? null"
      (selectedRoom)="selectRoom($event)"
      (addRoom)="openCreateRoom()"
      (addDm)="openCreateDm()"
    />
  </aside>

  <div class="main">
    <app-chat-header
      [room]="activeRoom()"
      [activeUsersCount]="activeUsersCount()"
      (toggleSidebar)="toggleSidebar()"
      (openMembers)="showMembers.set(true)"
    />
    <app-message-list
      class="message-list"
      [messages]="messages()"
      [isLoadingTop]="isLoading()"
      [isLoadingBottom]="isLoadingOlderMessages()"
      (fetchMessages)="loadMoreMessages($event)"
    />
    <app-message-input (sendMessage)="sendMessage($event)" />
  </div>

</div>

<app-create-room-dialog
  [(visible)]="showCreateRoom"
  (submitted)="onRoomCreated($event)"
/>

<app-create-dm-dialog
  [(visible)]="showCreateDm"
  [excludeIds]="[currentUserId()]"
  (submitted)="onDmCreated($event)"
/>

<app-join-room-dialog
  [room]="pendingJoinRoom()"
  [(visible)]="showJoinRoom"
  (joined)="onRoomJoined()"
/>

<app-room-members
  [room]="activeRoom()"
  [(visible)]="showMembers"
/>
