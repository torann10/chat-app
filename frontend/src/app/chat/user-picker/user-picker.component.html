<div class="user-picker">

  <p-iconfield class="search">
    <p-inputicon class="pi pi-search" />
    <input
      pInputText
      [formControl]="searchControl"
      [placeholder]="'app.search_people' | translate"
      class="input"
      autocomplete="off" />
  </p-iconfield>

  <div class="list">

    @if (isLoading()) {
      @for (row of skeletonRows; track $index) {
        <div class="skeleton-item">
          <p-skeleton shape="circle" size="2.25rem"/>
          <div class="skeleton-info">
            <p-skeleton height="0.75rem" width="55%" />
            <p-skeleton height="0.625rem" width="40%" />
          </div>
        </div>
      }
    } @else if (users().length === 0) {
      <div class="empty">
        <i class="pi pi-users empty-icon"></i>
        <p class="empty-text">{{ 'app.no_users_found' | translate }}</p>
      </div>
    } @else {
      @for (user of users(); track user.id) {
        <button
          type="button"
          class="item"
          (click)="select(user)">

          <p-avatar
            [label]="initials(user)"
            shape="circle"
            [style]="avatarStyle(user.id)"
            class="avatar-text-sm"
            size="normal" />

          <div class="info">
            <div class="name-row">
              <span class="name">
                {{ user.fullname || user.email }}
              </span>
              <span
                class="status"
                [class.status-online]="user.isOnline"
                [title]="user.isOnline ? 'app.online' : 'app.offline' | translate | titlecase">
              </span>
            </div>
            @if (user.fullname) {
              <p class="email">{{ user.email }}</p>
            }
          </div>

        </button>
      }
    }

  </div>
</div>
