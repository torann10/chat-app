<p-dialog
  [(visible)]="visible"
  [header]="'app.new_direct_message' | translate"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="dm-dialog"
  (onHide)="close()">

  <app-user-picker
    [excludeIds]="excludeIds()"
    (userSelected)="onUserSelected($event)" />

</p-dialog>
