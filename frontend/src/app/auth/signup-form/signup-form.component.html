<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="signup-form">

  <div class="header">
    <h2 class="title">{{ 'create_an_account' | i18next }}</h2>
    <p class="subtitle">{{ 'fill_details' | i18next }}</p>
  </div>

  @if (error(); as err) {
    <div class="error">
      <i class="pi pi-exclamation-circle error-icon"></i>
      <span>{{ err | i18next }}</span>
    </div>
  }

  <div class="group">
    <label class="label" for="signup-email">{{ 'email' | i18next }}</label>
    <input 
      pInputText
      i18nextValidationMessage 
      id="signup-email" 
      type="email" 
      formControlName="email"
      placeholder="you@example.com" 
      class="input" 
      autocomplete="email" 
    />
  </div>

  <div class="group">
    <label class="label" for="signup-fullname">{{ 'fullname' | i18next }}</label>
    <input 
      pInputText
      i18nextValidationMessage
      id="signup-fullname" 
      type="text" 
      formControlName="fullname"
      placeholder="e.g. Jane Doe" 
      class="input" 
      autocomplete="fullname" 
    />
  </div>

  <div class="group">
    <label class="label" for="signup-password">{{ 'password' | i18next }}</label>
    <p-password 
      inputId="signup-password" 
      i18nextValidationMessage
      formControlName="password"
      [toggleMask]="true" 
      [feedback]="false"
      placeholder="At least 6 characters"
      class="input"
      inputStyleClass="input"
      autocomplete="new-password" 
    />
  </div>

  <p-button 
    type="submit" 
    label="{{ 'create_account' | i18next }}" 
    icon="pi pi-user-plus" 
    iconPos="right"
    [disabled]="isLoading()" 
    [loading]="isLoading()" 
    styleClass="button" 
  />

  <div class="divider">
    <div class="divider-content">
      <span class="divider-text">{{ 'or_continue_with' | i18next }}</span>
    </div>
  </div>

  <app-social-auth />

</form>

<div class="signup-footer">
  {{ 'have_account' | i18next }}
  <a routerLink="/auth/login" class="link">
    {{ 'sign_in' | i18next }}
  </a>
</div>
