<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-5">

  <div class="space-y-1">
    <h2 class="text-xl font-bold">{{ 'create_an_account' | i18next }}</h2>
    <p class="text-sm">{{ 'fill_details' | i18next }}</p>
  </div>

  @if (error(); as err) {
    <div class="flex items-start gap-2 rounded-lg border border-red-500/20 bg-red-500/10 p-3 text-sm text-red-400">
      <i class="pi pi-exclamation-circle mt-0.5 shrink-0"></i>
      <span>{{ err | i18next }}</span>
    </div>
  }

  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium" for="signup-email">{{ 'email' | i18next }}</label>
    <input 
      pInputText
      i18nextValidationMessage 
      id="signup-email" 
      type="email" 
      formControlName="email"
      placeholder="you@example.com" 
      class="w-full" 
      autocomplete="email" 
    />
  </div>

  <div class="flex flex-col gap-1.5 w-full min-w-0">
    <label class="text-sm font-medium" for="signup-fullname">{{ 'fullname' | i18next }}</label>
    <input 
      pInputText
      i18nextValidationMessage
      id="signup-fullname" 
      type="text" 
      formControlName="fullname"
      placeholder="e.g. Jane Doe" 
      class="w-full" 
      autocomplete="fullname" 
    />
  </div>

  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium" for="signup-password">{{ 'password' | i18next }}</label>
    <p-password 
      inputId="signup-password" 
      i18nextValidationMessage
      formControlName="password"
      [toggleMask]="true" 
      [feedback]="false"
      placeholder="At least 6 characters"
      class="w-full"
      inputStyleClass="w-full"
      autocomplete="new-password" 
    />
  </div>

  <p-button 
    type="submit" 
    label="{{ 'create_account' | i18next }}" 
    icon="pi pi-user-plus" 
    iconPos="right"
    [disabled]="isLoading()" 
    [loading]="isLoading()" 
    styleClass="w-full" 
  />

  <div class="relative my-2">
    <div class="relative flex justify-center">
      <span class="px-3 text-xs">{{ 'or_continue_with' | i18next }}</span>
    </div>
  </div>

  <app-social-auth />

</form>

<div class="mt-6 text-center text-sm">
  {{ 'have_account' | i18next }}
  <a routerLink="/auth/login" class="font-medium hover:underline">
    {{ 'sign_in' | i18next }}
  </a>
</div>
