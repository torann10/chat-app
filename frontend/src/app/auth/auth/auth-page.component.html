<div class="flex align-items-center justify-content-center min-h-screen">
  <p-card [header]="isLoginMode ? 'Welcome Back' : 'Create an Account'" [style]="{ width: '400px' }">
    
    @if (error) {
      <p-message severity="error" styleClass="w-full mb-3">{{ error }}</p-message>
    }

    <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-3 mt-3">
      
      <div class="flex flex-column gap-2">
        <label htmlFor="email">Email</label>
        <input 
          pInputText 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="Enter your email" 
          class="w-full" />
      </div>

      @if (!isLoginMode) {
        <div class="flex flex-column gap-2">
          <label htmlFor="username">Username</label>
          <input 
            pInputText 
            id="username" 
            type="text" 
            formControlName="username" 
            placeholder="Choose a username" 
            class="w-full" />
        </div>
      }

      <div class="flex flex-column gap-2">
        <label htmlFor="password">Password</label>
        <p-password 
          id="password" 
          formControlName="password" 
          [toggleMask]="true" 
          [feedback]="!isLoginMode" 
          promptLabel="Enter a password"
          weakLabel="Too simple"
          mediumLabel="Average complexity"
          strongLabel="Complex password"
          placeholder="Enter your password"
          styleClass="w-full"
          inputStyleClass="w-full">
        </p-password>
      </div>

      <p-button 
        type="submit" 
        [label]="isLoginMode ? 'Log In' : 'Sign Up'" 
        [disabled]="authForm.invalid || isLoading" 
        [loading]="isLoading"
        styleClass="w-full mt-2">
      </p-button>

    </form>

    <button type="button" (click)="switchMode()" class="p-link text-primary hover:underline">
        {{ isLoginMode ? 'Need an account? Sign Up' : 'Already have an account? Log In' }}
    </button>

    <p-divider align="center">
      <span class="text-color-secondary">OR</span>
    </p-divider>

    <div class="flex flex-column gap-2 mt-3">
      <a 
        pButton 
        href="http://localhost:3000/auth/google" 
        severity="secondary" 
        icon="pi pi-google" 
        label="Continue with Google" 
        class="w-full p-button-outlined">
      </a>
      
      <a 
        pButton 
        href="http://localhost:3000/auth/facebook" 
        severity="secondary" 
        icon="pi pi-facebook" 
        label="Continue with Facebook" 
        class="w-full p-button-outlined">
      </a>
    </div>

  </p-card>
</div>
