<div class="p-4 bg-white border-t border-gray-200">
  <form (ngSubmit)="onSubmit()" class="flex gap-2">
    <input 
      type="text" 
      pInputText 
      [ngModel]="messageText()" 
      (ngModelChange)="messageText.set($event)"
      name="message"
      placeholder="Type your message..." 
      class="flex-1 w-full p-inputtext-sm"
      autocomplete="off" />
      
    <p-button 
      type="submit" 
      icon="pi pi-send" 
      [disabled]="!messageText().trim()" />
  </form>
</div>
