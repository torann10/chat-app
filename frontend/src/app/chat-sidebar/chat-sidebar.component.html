<div class="flex flex-col h-full bg-white surface-border">
  <div class="p-4 border-b border-gray-200">
    <h2 class="text-xl font-bold text-gray-800">Messages</h2>
  </div>

  <div class="flex-1 overflow-y-auto p-3">
    <p-menu [model]="menuItems()" styleClass="w-full border-none bg-transparent p-0">
      <ng-template pTemplate="item" let-item>
        <a class="cursor-pointer flex items-center justify-between px-3 py-2 rounded-lg transition-colors hover:bg-gray-100"
            [class.bg-blue-50]="item.id === activeRoomId()"
            [class.text-blue-700]="item.id === activeRoomId()"
            [class.text-gray-700]="item.id !== activeRoomId()">
          
          <div class="flex items-center gap-2">
            @if (item.icon) {
              <i [class]="item.icon"></i>
            } @else {
              <div class="w-2 h-2 rounded-full bg-green-500"></div>
            }
            <span class="font-medium">{{ item.label }}</span>
          </div>
          
          @if (item.badge) {
            <p-badge [value]="item.badge" severity="danger"></p-badge>
          }
        </a>
      </ng-template>
    </p-menu>
  </div>
</div>
